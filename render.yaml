services:
  - type: web
    name: careerforge-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: MONGODB_URI
        sync: false

      - key: DATABASE_NAME
        value: careerforge

      - key: FRONTEND_URL
        sync: false
